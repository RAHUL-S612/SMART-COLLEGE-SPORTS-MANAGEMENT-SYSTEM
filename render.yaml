services:
  - type: web
    name: smartsportal
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartsportal-db
          property: connectionString

databases:
  - name: smartsportal-db
    databaseName: sports_db
    user: smartsportal_user