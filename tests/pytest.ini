# =============================================================
#  SCSS — pytest.ini
#  Pytest configuration for Smart College Sports Management System
#  Place this file in the project root (same level as app.py)
# =============================================================

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:warnings

# Custom markers (use -m flag to run specific groups)
markers =
    auth:        Authentication tests (TC-01, TC-02, TC-03)
    players:     Player management tests (TC-04)
    matches:     Match scheduling tests (TC-05, TC-06)
    scores:      Score entry tests (TC-07, TC-08)
    certificates: Certificate tests (TC-09, TC-10, TC-12)
    leaderboard: Leaderboard tests (TC-11)
    analytics:   Analytics/report tests (TC-13)
    security:    Security tests (TC-14, TC-15)
    integration: End-to-end integration tests
    slow:        Tests that take >1s (QR generation, PDF rendering)
